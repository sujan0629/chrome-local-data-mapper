name: Build Windows Executable & Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Automated Self-Tests
        run: python app.py --test

      - name: Build Standalone ChromeHistoryStudio.exe
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --onefile --name "ChromeHistoryStudio" app.py

      - name: Upload ChromeHistoryStudio.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChromeHistoryStudio-Windows-x64
          path: dist/ChromeHistoryStudio.exe

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ChromeHistoryStudio.exe
          generate_release_notes: true
